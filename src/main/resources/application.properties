spring.application.name=${APP_NAME}


spring.profiles.active=dev

# ============ PostgreSQL ============
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
#spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}

# ============ Gmail SMTP ============
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED}

# ============ CFO - User ============
cfo.user.id=${CFO_USER_ID}
cfo.user.email=${CFO_USER_EMAIL}
cfo.user.name=${CFO_USER_NAME}

# ============ CFO - LLM ============
cfo.llm.provider=${LLM_PROVIDER}

# Ollama
cfo.llm.ollama.base-url=${OLLAMA_BASE_URL}
cfo.llm.ollama.model=${OLLAMA_MODEL}
cfo.llm.ollama.temperature=${OLLAMA_TEMPERATURE}
cfo.llm.ollama.max-tokens=${OLLAMA_MAX_TOKENS}

# Claude
cfo.llm.claude.api-key=${CLAUDE_API_KEY}
cfo.llm.claude.model=${CLAUDE_MODEL}

# OpenAI
cfo.llm.openai.api-key=${OPENAI_API_KEY}
cfo.llm.openai.model=${OPENAI_MODEL}

# ============ CFO - Groww ============
cfo.groww.base-url=${GROWW_BASE_URL}
cfo.groww.holdings-path=${GROWW_HOLDINGS_PATH}
cfo.groww.transactions-path=${GROWW_TRANSACTIONS_PATH}
cfo.groww.token-encryption-key=${GROWW_ENCRYPTION_KEY}

# ============ CFO - News ============
cfo.news.max-articles-per-source=${NEWS_MAX_ARTICLES:15}
cfo.news.fetch-timeout-ms=${NEWS_TIMEOUT_MS:10000}
# Indian sources (set env var to empty string to disable)
cfo.news.sources.economic-times=${NEWS_ET:}
cfo.news.sources.livemint=${NEWS_LIVEMINT:}
cfo.news.sources.moneycontrol=${NEWS_MC:}
cfo.news.sources.business-standard=${NEWS_BS:}
cfo.news.sources.reuters-india=${NEWS_REUTERS:}
cfo.news.sources.financial-express=${NEWS_FE:}
cfo.news.sources.business-today=${NEWS_BT:}
cfo.news.sources.et-economy=${NEWS_ET_ECONOMY:}
cfo.news.sources.moneycontrol-markets=${NEWS_MC_MARKETS:}
# Global sources
cfo.news.sources.bloomberg=${NEWS_BLOOMBERG:}
cfo.news.sources.ft=${NEWS_FT:}
cfo.news.sources.wsj-markets=${NEWS_WSJ:}
cfo.news.sources.reuters-world=${NEWS_REUTERS_WORLD:}
cfo.news.sources.bbc-business=${NEWS_BBC:}
cfo.news.sources.aljazeera-business=${NEWS_ALJAZEERA:}
# Government / Regulatory
cfo.news.sources.sebi=${NEWS_SEBI:}
cfo.news.sources.pib=${NEWS_PIB:}
cfo.news.sources.nse=${NEWS_NSE:}
cfo.news.sources.bse=${NEWS_BSE:}



# ============ CFO - PDF ============
spring.servlet.multipart.enabled=${MULTIPART_ENABLED}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}
cfo.pdf.upload-dir=${PDF_UPLOAD_DIR}

# ============ CFO - Price Data ============
# Primary provider: yahoo-finance | alpha-vantage | nse-india
cfo.price.provider=${PRICE_PROVIDER:yahoo-finance}
# Comma-separated fallback chain (tried in order if primary fails)
cfo.price.fallback-providers=${PRICE_FALLBACK_PROVIDERS:alpha-vantage,nse-india}
# Alpha Vantage API key (free at alphavantage.co — 25 req/day)
cfo.price.alpha-vantage.api-key=${ALPHA_VANTAGE_KEY:}
# Days of price history to fetch per symbol
cfo.price.history-days=${PRICE_HISTORY_DAYS:30}
cfo.price.cold-start-days=${PRICE_COLD_START_DAYS:730}
# Delay between fetching each symbol (ms) — respects rate limits
cfo.price.inter-symbol-delay-ms=${PRICE_INTER_SYMBOL_DELAY_MS:500}

# ============ Market Data (NSE archives) ============
# Delay between archive requests during seed walk (2 requests per date)
marketdata.seed.throttle-ms=${MARKETDATA_SEED_THROTTLE_MS:800}
# Daily EOD ingestion + trailing gap repair (IST, after NSE publishes bhavcopy)
marketdata.eod.cron=${MARKETDATA_EOD_CRON:0 45 18 * * MON-FRI}

# ============ Macro automation (DF-3) ============
# Generic macro_series table is sourced from FBIL / RBI / MOSPI + DF-1's index
# feed. URLs are config-driven (sources change paths without notice); blank URLs
# disable that source and MacroStateService falls back to the cfo.macro.* config
# constants below. Endpoints must be re-verified at deploy time.
cfo.macro.fbil.par-yield-url=${FBIL_PAR_YIELD_URL:}
cfo.macro.fbil.reference-rate-url=${FBIL_REFERENCE_RATE_URL:}
cfo.macro.rbi.rates-url=${RBI_RATES_URL:https://www.rbi.org.in}
# India VIX is read from md_index_eod (the ind_close_all file), not Yahoo.
cfo.macro.vix-index-name=${MACRO_VIX_INDEX_NAME:India VIX}
# MOSPI via data.gov.in — needs a free api-key and per-dataset resource IDs.
cfo.macro.mospi.base-url=${MOSPI_BASE_URL:https://api.data.gov.in/resource}
cfo.macro.mospi.api-key=${MOSPI_API_KEY:}
cfo.macro.mospi.limit=${MOSPI_LIMIT:1000}
cfo.macro.mospi.month-field=${MOSPI_MONTH_FIELD:month}
cfo.macro.mospi.year-field=${MOSPI_YEAR_FIELD:year}
cfo.macro.mospi.value-field=${MOSPI_VALUE_FIELD:value}
cfo.macro.mospi.cpi-headline-resource=${MOSPI_CPI_HEADLINE_RESOURCE:}
cfo.macro.mospi.cpi-core-resource=${MOSPI_CPI_CORE_RESOURCE:}
cfo.macro.mospi.iip-resource=${MOSPI_IIP_RESOURCE:}
cfo.macro.mospi.wpi-resource=${MOSPI_WPI_RESOURCE:}

# ============ Policy Intelligence ============
policy.chunk.max-chars=${POLICY_CHUNK_MAX_CHARS:1800}
policy.chunk.overlap-chars=${POLICY_CHUNK_OVERLAP_CHARS:200}
policy.max-articles-per-source=${POLICY_MAX_ARTICLES_PER_SOURCE:10}
policy.fetch-timeout-ms=${POLICY_FETCH_TIMEOUT_MS:15000}
policy.user-agent=${POLICY_USER_AGENT:FinwisePolicyBot/1.0}
policy.storage-dir=${POLICY_STORAGE_DIR:/tmp/finwise-policy}
policy.html-extraction-enabled=${POLICY_HTML_EXTRACTION_ENABLED:true}
policy.pdf-extraction-enabled=${POLICY_PDF_EXTRACTION_ENABLED:true}
policy.sync.enabled=${POLICY_SYNC_ENABLED:false}
policy.sync.cron=${POLICY_SYNC_CRON:0 15 8,14,20 * * MON-SAT}

policy.sources.rbi.enabled=${POLICY_RBI_ENABLED:true}
policy.sources.rbi.feed-url=${POLICY_RBI_FEED_URL:}
policy.sources.rbi.base-url=${POLICY_RBI_BASE_URL:https://www.rbi.org.in}
policy.sources.rbi.authority=RBI

policy.sources.sebi.enabled=${POLICY_SEBI_ENABLED:true}
policy.sources.sebi.feed-url=${POLICY_SEBI_FEED_URL:}
policy.sources.sebi.base-url=${POLICY_SEBI_BASE_URL:https://www.sebi.gov.in}
policy.sources.sebi.authority=SEBI

policy.sources.pib.enabled=${POLICY_PIB_ENABLED:true}
policy.sources.pib.feed-url=${POLICY_PIB_FEED_URL:}
policy.sources.pib.base-url=${POLICY_PIB_BASE_URL:https://pib.gov.in}
policy.sources.pib.authority=PIB

# ============ Scheduler ============
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE}

# ============ Logging ============
logging.level.org.amit.finwise=${LOG_LEVEL_APP}
logging.level.org.amit.finwise.cfo=${LOG_LEVEL_CFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING}
