# ============ App ============
spring.application.name=finwise

# ============ PostgreSQL ============
spring.datasource.url=jdbc:postgresql://localhost:5432/finwise
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============ Gmail SMTP ============
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============ CFO - User ============
cfo.user.id=amit
cfo.user.email=your_email@gmail.com
cfo.user.name=Amit

# ============ CFO - LLM ============
cfo.llm.provider=google

# Google AI Studio
cfo.llm.google.api-key=AQ.Ab8RN6IdrEN-u6l6RDDzEFZnVofXCADIwYrTtg7HgnvDs4eQZA
cfo.llm.google.model=gemini-flash-latest
cfo.llm.google.temperature=0.3

# Claude
cfo.llm.claude.api-key=
cfo.llm.claude.model=claude-opus-4-6

# OpenAI
cfo.llm.openai.api-key=
cfo.llm.openai.model=gpt-4o

# ============ CFO - Groww ============
cfo.groww.base-url=https://api.groww.in
cfo.groww.holdings-path=/v1/holdings/user
cfo.groww.transactions-path=/v1/transactions/user
cfo.groww.token-encryption-key=dev_secret_32_char_key_here

# ============ CFO - News ============
cfo.news.max-articles-per-source=15
# ET markets — use rssfeeds/<sectionId>.cms format (same pattern as working et-economy)
cfo.news.sources.economic-times=https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms
cfo.news.sources.livemint=https://www.livemint.com/rss/markets
cfo.news.sources.moneycontrol=https://www.moneycontrol.com/rss/business.xml
# business-standard returns 403 for automated requests — disabled
cfo.news.sources.business-standard=
# reuters public feeds were decommissioned; override with empty so it's skipped
cfo.news.sources.reuters-india=
cfo.news.fetch-timeout-ms=15000

# Global Business / Markets
cfo.news.sources.bloomberg=https://feeds.bloomberg.com/markets/news.rss
cfo.news.sources.ft=https://www.ft.com/markets?format=rss
cfo.news.sources.wsj-markets=https://feeds.a.dj.com/rss/RSSMarketsMain.xml

# Indian Business (More Depth)
cfo.news.sources.financial-express=https://www.financialexpress.com/market/feed/
cfo.news.sources.business-today=https://www.businesstoday.in/rss/markets
# economy-watch — malformed XML fixed by ampersand sanitization in NewsAggregatorService
cfo.news.sources.economy-watch=https://economywatch.com/feed

# Reuters retired feeds.reuters.com; replaced with The Guardian Business (reliable open RSS, equivalent global coverage)
cfo.news.sources.reuters-world=https://www.theguardian.com/uk/business/rss
cfo.news.sources.bbc-business=https://feeds.bbci.co.uk/news/business/rss.xml
cfo.news.sources.aljazeera-business=https://www.aljazeera.com/xml/rss/all.xml
# chatham-house blocks bots; replaced with Foreign Policy (same geopolitical scope, open RSS)
cfo.news.sources.chatham-house=https://foreignpolicy.com/feed/
# IMF blocks automated requests (403); disabled
cfo.news.sources.imf-blog=
# World Bank news RSS returns 404; disabled
cfo.news.sources.worldbank-blog=

# PIB (Press Information Bureau) – MOST IMPORTANT
# ModId=6 = Ministry of Finance; Lang=1 = English. Bare URL returns HTML challenge page.
cfo.news.sources.pib=https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1

# finmin.gov.in times out; use DEA (Dept of Economic Affairs, same ministry) press releases
cfo.news.sources.finmin=https://dea.gov.in/rss.xml

# NITI Aayog
cfo.news.sources.niti-aayog=https://niti.gov.in/rss.xml

# SEBI (Market Regulations)
cfo.news.sources.sebi=https://www.sebi.gov.in/sebirss.xml

# MCA (Corporate Affairs) — 403, blocks automated access.
# Corporate governance/regulatory news from MCA is covered via:
#   - SEBI RSS (already active) for listed company compliance
#   - PIB (already active) for MCA policy announcements
cfo.news.sources.mca=

# MOSPI — malformed XML fixed by Rome's xmlHealer (setXmlHealerOn=true in NewsAggregatorService)
cfo.news.sources.mospi=https://mospi.gov.in/rss.xml

# MOSPI (already active above) is the primary stats authority. Add The Hindu Business Line for broader India economic coverage.
cfo.news.sources.statistics-india=https://www.thehindubusinessline.com/feeder/default.rss

# Economic Times Economy
cfo.news.sources.et-economy=https://economictimes.indiatimes.com/news/economy/rssfeeds/1373380680.cms

cfo.news.sources.moneycontrol-markets=https://www.moneycontrol.com/rss/marketreports.xml
# NSE / BSE direct RSS endpoints require JS-rendered sessions and block bots.
# Corporate announcements (earnings, board meetings, dividends) are covered via:
#   1. ET Markets corporate actions (same data, public RSS)
#   2. Moneycontrol corporate announcements (same data, public RSS)
# For real-time NSE/BSE exchange filings, implement a dedicated GrowwConnector-style
# client using NSE's archive API: https://nsearchives.nseindia.com/content/announcements/
cfo.news.sources.nse=
cfo.news.sources.bse=
# ET earnings — use rssfeeds/<sectionId>.cms format
cfo.news.sources.et-corporate=https://economictimes.indiatimes.com/markets/earnings/rssfeeds/13358574.cms
# Moneycontrol corporate — better headers from code should reduce 503s
cfo.news.sources.moneycontrol-corporate=https://www.moneycontrol.com/rss/corporateactions.xml



# ── CFO News Configuration ──────────────────────────────────────────────────
cfo.news.fetch-cron=0 0/30 6-22 * * MON-SAT

# ── Symbols & Gazetteer ─────────────────────────────────────────────────────
cfo.symbols.gazetteer-path=classpath:data/symbol_gazetteer.csv

# ── LLM & Enrichment Logic ──────────────────────────────────────────────────
cfo.llm.enabled=true
cfo.llm.confidence-threshold=0.55
cfo.llm.max-batch-size=5

# ── Spring AI (Anthropic / Claude) ──────────────────────────────────────────
# LlmRefinementService now uses LLMProvider (cfo.llm.provider), not Spring AI's ChatModel.
# These properties are only needed if something else in the app uses ChatModel directly.
# spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
# spring.ai.anthropic.chat.options.model=claude-sonnet-4-6
# spring.ai.anthropic.chat.options.max-tokens=2000
# spring.ai.anthropic.chat.options.temperature=0.1

# ============ CFO - PDF ============
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
document.upload-dir=/tmp/finwise-docs

# ============ HikariCP Connection Pool ============
# Default pool size is 10 which is too large for a local dev setup with blocking LLM threads.
# 5 connections is enough for this workload; prevents "Thread starvation or clock leap" warnings.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# Leak detection: log if a connection is held for longer than 60s (likely blocking LLM call)
spring.datasource.hikari.leak-detection-threshold=60000

# ============ Scheduler ============
spring.task.scheduling.pool.size=5

# ============ Policy Intelligence ============
policy.chunk.max-chars=1800
policy.chunk.overlap-chars=200
policy.max-articles-per-source=10
policy.fetch-timeout-ms=15000
policy.user-agent=FinwisePolicyBot/1.0
policy.storage-dir=/tmp/finwise-policy
policy.html-extraction-enabled=true
policy.pdf-extraction-enabled=true
policy.sync.enabled=false
policy.sync.cron=0 15 8,14,20 * * MON-SAT

policy.sources.rbi.enabled=true
policy.sources.rbi.feed-url=https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=feed
policy.sources.rbi.base-url=https://www.rbi.org.in
policy.sources.rbi.authority=RBI

policy.sources.sebi.enabled=true
policy.sources.sebi.feed-url=https://www.sebi.gov.in/sebirss.xml
policy.sources.sebi.base-url=https://www.sebi.gov.in
policy.sources.sebi.authority=SEBI

policy.sources.pib.enabled=true
policy.sources.pib.feed-url=https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1
policy.sources.pib.base-url=https://pib.gov.in
policy.sources.pib.authority=PIB

# ============ CFO - Macro State (Phase 5) ============
# RBI Repo Rate (%, updated on RBI policy announcements)
cfo.macro.repo-rate=6.50
cfo.macro.repo-rate-as-of=2026-05-26

# Latest CPI YoY inflation (%, monthly from MOSPI)
cfo.macro.cpi-yoy=4.83
cfo.macro.cpi-as-of=Apr 2026

# 10-Year Government Security yield (%, from RBI/market data)
cfo.macro.gsec-yield-10y=7.20
cfo.macro.gsec-yield-as-of=2026-05-30

# GDP Growth (%, quarterly from MOSPI)
cfo.macro.gdp-growth=6.2
cfo.macro.gdp-as-of=2026-03-31

# Note: USD/INR and India VIX are fetched live from Yahoo Finance daily.
# FII/DII flows are optional (would need NSDL/NSE scraping).

# ============ Logging ============
logging.level.org.amit.finwise=DEBUG
logging.level.org.amit.finwise.cfo=DEBUG
logging.level.org.springframework.web=INFO
